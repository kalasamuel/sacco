<ui:composition
        template="/WEB-INF/templates/login-template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:pt="jakarta.faces.passthrough">

    <ui:define name="title">
        Login | Kimwanyi SACCO
    </ui:define>

    <ui:define name="formContent">




        <h2 class="form-heading">Welcome Back!</h2>
        <p class="form-subtitle">Sign in to continue</p>



        <h:form styleClass="login-form">

            <!-- Username -->
            <div class="field">
                <h:outputLabel for="username" value="Username/Email"/>
                <div class="input-wrap">
                    <h:inputText id="username" value="#{loginBean.loginForm.username}"
                                 pt:placeholder="Enter username/email"
                                 styleClass="sacco-field"/>
                </div>
            </div>

            <!-- Password -->
            <div class="field">
                <h:outputLabel for="password" value="Password"/>
                <div class="input-wrap">
                    <h:inputSecret id="password" value="#{loginBean.loginForm.password}"
                                   pt:placeholder="Enter password"
                                   styleClass="sacco-field sacco-field-eye"/>
                </div>
            </div>

            <!-- Remember me -->
            <label class="remember-row">
                <input type="checkbox"/>
                Remember me
            </label>

            <!-- Sign In -->
            <h:commandButton value="SIGN IN"
                             action="#{loginBean.login}"
                             styleClass="btn-signin"/>

            <!-- Register link -->
            <div class="register-row">
                Don't have an account?&#160;
                <h:link value="REGISTER" outcome="/members/register.xhtml"/>
            </div>

        </h:form>

    </ui:define>

    <ui:define name="sideContent">

        <style>
            .side-heading {
                font-size: 1.8rem;
                font-weight: 800;
                color: white;
                line-height: 1.3;
            }
            .side-text {
                margin-top: 1rem;
                color: rgba(255,255,255,0.85);
                font-size: 0.95rem;
                line-height: 1.6;
            }
            .btn-register {
                display: inline-block;
                margin-top: 2rem;
                border: 2px solid white;
                border-radius: 0.75rem;
                padding: 0.85rem 2.5rem;
                color: white;
                font-weight: 700;
                font-size: 0.9rem;
                letter-spacing: 0.06em;
                text-decoration: none;
                transition: background 0.2s, color 0.2s;
            }
            .btn-register:hover {
                background: white;
                color: #79f349;
            }
        </style>

        <h2 class="side-heading">Join Kimwanyi SACCO</h2>

        <p class="side-text">
            Create an account today and enjoy seamless access to our services.
        </p>

        <h:link value="REGISTER NOW"
                outcome="/members/register.xhtml"
                styleClass="btn-register"/>

    </ui:define>

</ui:composition>
